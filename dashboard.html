<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guard Dashboard</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/announcements.css">
</head>
<body class="protected" data-root="../">
<main class="card wide">
  <h1>Guard Dashboard</h1>
  <p class="subtitle" id="welcome"></p>

  <h2 class="section-title">Announcements</h2>
  <div id="announcements"></div>

  <button class="logout" onclick="logout()">Log out</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/announcements.js"></script>
<script>
requireRole(["guard"]).then((p) => {
    document.getElementById("welcome").textContent = "Welcome, " + p.full_name + ".";
    loadAnnouncements("announcements");
});
</script>
</body></html>
