<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - School Security System</title><link rel="stylesheet" href="css/style.css"></head>
<body data-root="">
<div class="card">
  <h1>School Security</h1>
  <p class="subtitle">Sign in to your account</p>
  <form id="loginForm">
    <label for="identifier">Username or email</label>
    <input id="identifier" type="text" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div id="msg" class="message" hidden></div>
    <button type="submit" id="btn">Login</button>
  </form>
  <p class="link">No account yet? <a href="register.html">Register</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn");
    btn.disabled = true; showMessage("msg", "");
    const result = await loginUser(
        document.getElementById("identifier").value,
        document.getElementById("password").value
    );
    if (result.error) { showMessage("msg", result.error); btn.disabled = false; return; }
    location.replace(result.redirect);
});
</script>
</body></html>
