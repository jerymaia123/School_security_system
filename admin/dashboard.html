<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard</title><link rel="stylesheet" href="../css/style.css"></head>
<body class="protected" data-root="../">
<main class="card wide">
  <h1>Admin Dashboard</h1>
  <p class="subtitle" id="welcome"></p>
  <button onclick="logout()">Log out</button>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script>
requireRole(["admin"]).then(p => {
    document.getElementById("welcome").textContent = "Welcome, " + p.full_name + ".";
});
</script>
</body></html>
